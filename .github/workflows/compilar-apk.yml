name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ReservasQR.apk

      - name: Guardar APK (pestaña Actions)
        uses: actions/upload-artifact@v4
        with:
          name: ReservasQR-apk
          path: ReservasQR.apk

      - name: Publicar en Releases (descarga directa desde el teléfono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Reservas QR ${{ github.run_number }}
          files: ReservasQR.apk
          make_latest: true
