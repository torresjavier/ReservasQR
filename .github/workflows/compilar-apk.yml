name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E -A6 "What went wrong|^e: |error:|ERROR:|AAPT|Could not resolve|Could not find|Unresolved reference" build.log \
              | grep -v -E "^\s+at |^--$" | head -80 > errores.txt
            { echo '## Errores de compilación'; echo '```'; cat errores.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            grep -E "What went wrong|^e: |error:|ERROR:|Could not" build.log | head -10 | while IFS= read -r l; do
              l="${l//'%'/'%25'}"; echo "::error::$l"
            done
          fi
          exit $code

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ReservasQR.apk

      - name: Guardar APK (pestaña Actions)
        uses: actions/upload-artifact@v4
        with:
          name: ReservasQR-apk
          path: ReservasQR.apk

      - name: Publicar en Releases (descarga directa desde el teléfono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Reservas QR ${{ github.run_number }}
          files: ReservasQR.apk
          make_latest: true
